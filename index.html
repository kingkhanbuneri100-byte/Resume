                                    </h2>
                                    <p className="text-xs text-slate-500 mt-1">
                                        Commercial logistics, e-commerce, and transport client websites built & managed.
                                    </p>
                                </div>
                                <div className="flex gap-1.5 no-print">
                                    <button 
                                        onClick={() => setSiteFilter('All')}
                                        className={`px-3 py-1 rounded-lg text-xs font-semibold border ${siteFilter === 'All' ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-600 border-slate-200'}`}
                                    >
                                        All ({cvData.portfolioWebsites.length})
                                    </button>
                                    <button 
                                        onClick={() => setSiteFilter('Personal')}
                                        className={`px-3 py-1 rounded-lg text-xs font-semibold border ${siteFilter === 'Personal' ? 'bg-purple-700 text-white border-purple-700' : 'bg-purple-50 text-purple-700 border-purple-200'}`}
                                    >
                                        Personal
                                    </button>
                                    <button 
                                        onClick={() => setSiteFilter('Client')}
                                        className={`px-3 py-1 rounded-lg text-xs font-semibold border ${siteFilter === 'Client' ? 'bg-blue-700 text-white border-blue-700' : 'bg-blue-50 text-blue-700 border-blue-200'}`}
                                    >
                                        Client Projects
                                    </button>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {filteredWebsites.map((site, idx) => (
                                    <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-200/80 hover:border-slate-300 transition flex flex-col justify-between group">
                                        <div>
                                            <div className="flex items-center justify-between mb-2">
                                                <span className={`px-2.5 py-0.5 text-[10px] font-bold rounded-full uppercase tracking-wider ${site.type === 'Personal' ? 'bg-purple-100 text-purple-800 border border-purple-200' : 'bg-blue-100 text-blue-800 border border-blue-200'}`}>
                                                    {site.type}
                                                </span>
                                                <i className="fa-solid fa-arrow-up-right-from-square text-slate-400 group-hover:text-blue-600 transition text-xs"></i>
                                            </div>
                                            <h3 className="font-bold text-slate-800 text-sm group-hover:text-blue-600 transition flex items-center gap-2">
                                                <i className="fa-solid fa-laptop-code text-slate-400 text-xs"></i>
                                                {site.name}
                                            </h3>
                                            <p className="text-xs text-slate-500 mt-1">{site.category}</p>
                                        </div>
                                        <div className="mt-4 pt-3 border-t border-slate-200/80 flex items-center justify-between">
                                            <span className="text-[11px] font-mono text-slate-500 truncate max-w-[180px]">
                                                {site.url.replace('https://', '').replace('http://', '').replace(/\/$/, '')}
                                            </span>
                                            <a 
                                                href={site.url} 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                className="px-3 py-1 bg-white hover:bg-slate-900 hover:text-white text-slate-700 font-semibold rounded-lg text-xs transition border border-slate-200 shadow-sm flex items-center gap-1.5"
                                            >
                                                Visit Link <i className="fa-solid fa-arrow-right text-[10px]"></i>
                                            </a>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {activeTab === 'qrcode' && (
                        <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm text-center max-w-md mx-auto print-card">
                            <h2 className="text-base font-bold text-slate-900 mb-1">Interactive Mobile CV</h2>
                            <p className="text-xs text-slate-500 mb-6">Scan with any mobile camera or QR reader to view profile online.</p>

                            <div className="flex justify-center mb-6">
                                <div className="p-4 bg-slate-50 rounded-2xl border-2 border-dashed border-blue-200 inline-block shadow-inner">
                                    <div ref={qrRef} className="flex justify-center"></div>
                                </div>
                            </div>

                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs text-slate-700 font-medium flex items-center justify-center gap-2">
                                <i className="fa-solid fa-check-circle text-emerald-600"></i>
                                Ready for business cards & direct recruitment sharing.
                            </div>
                        </div>
                    )}

                    <footer className="mt-8 text-center text-xs text-slate-400 py-4 no-print border-t border-slate-200/60">
                        Aziz Ullah Khan • Typing Specialist & Administrative Professional • Abu Dhabi, UAE
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
